name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.3'

      - name: Run Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint
  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.3'

      - name: Run bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
  syntax:
    timeout-minutes: 10
    name: syntax (PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.1'

      - name: Check the syntax of src
        run: |
          status=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1) || { echo "$output"; status=1; }
          done < <(find src -name '*.php' -print0)
          exit "$status"
